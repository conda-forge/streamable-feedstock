schema_version: 1

context:
  name: streamable
  version: "2.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ebonnal/streamable/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fcf1cbd7876e65ede807de9b542d00817dd01c46ab9dfd9f15e7bb6cbee59482

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - streamable
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Stream-like manipulation of iterables
  license: Apache-2.0
  license_file: LICENSE
  homepage: http://github.com/ebonnal/streamable

extra:
  recipe-maintainers:
    - thewchan
